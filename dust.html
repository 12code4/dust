<html lang="en">

    <title>Dust — M0</title>
    <style>
      :root {
        --bg: #0c0d10;
        --panel: #16181d;
        --edge: #26292f;
        --text: #c8ccd4;
        --dim: #7c808a;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 ui-monospace, 'Cascadia Mono', Menlo, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
        min-height: 100vh;
      }
      h1 { font-size: 15px; letter-spacing: 0.14em; font-weight: 600; }
      h1 .sub { color: #7c808a; font-weight: 400; letter-spacing: 0; }
      #toolbar, #controls {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--edge);
        border-radius: 5px;
        padding: 5px 11px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: #3a3e46; }
      button.active { border-color: #d8b45a; color: #d8b45a; }
      button .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      canvas {
        /* content-box keeps the 1px border outside the 800px content area, so
           the 400-cell grid displays at an exact 2x integer scale */
        box-sizing: content-box;
        width: 800px;
        max-width: calc(100% - 2px);
        image-rendering: pixelated;
        border: 1px solid var(--edge);
        border-radius: 4px;
        cursor: crosshair;
        touch-action: none;
      }
      #hud { color: #7c808a; display: flex; gap: 18px; }
      #hud b { color: var(--text); font-weight: 600; }
      .sep { width: 1px; align-self: stretch; background: var(--edge); }
