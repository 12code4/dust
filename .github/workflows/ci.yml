name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Perf bench is informational in CI — shared runners are too noisy for a
      # hard gate; the 8 ms budget is enforced against real hardware locally.
      - run: npm run bench
        continue-on-error: true
